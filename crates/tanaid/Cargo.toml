[package]
name = "tanaid"
edition.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "tanaid"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:reedline"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
reedline = { version = "0.48.0", optional = true }
lru = "0.18.0"
regex = "1.12.4"

[dev-dependencies]
