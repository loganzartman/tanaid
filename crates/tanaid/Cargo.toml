[package]
name = "tanaid"
description = "an experimental Tcl interpreter"
license = "MPL-2.0"
edition.workspace = true
version.workspace = true
publish = true

[[bin]]
name = "tanaid"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:reedline"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
reedline = { version = "0.48.0", optional = true }
lru = "0.18.0"
regex = "1.12.4"

[dev-dependencies]
libtest-mimic = "0.8.2"

# The sample suite builds its own list of test cases at runtime, so it replaces
# libtest rather than being driven by it.
[[test]]
name = "samples"
harness = false

[lints]
workspace = true
