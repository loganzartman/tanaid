[package]
name = "tanaid-tk"
description = "a minimal Tk for tanaid, drawn with wgpu"
license = "MPL-2.0"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
tanaid = { path = "../tanaid" }
web-sys = { version = "0.3.104", features = ["OffscreenCanvas"] }
wgpu = "30.0.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "1.0.1"
winit = "0.30.13"

[target.'cfg(target_family = "wasm")'.dependencies]
# WebGL2 covers the browsers that don't have WebGPU yet
wgpu = { version = "30.0.0", features = ["webgl"] }

[lints]
workspace = true
