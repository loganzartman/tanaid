[package]
name = "tanaid-wasm"
edition.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.104"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tanaid = { workspace = true }
# 0.5.6 does not have Ts<>
tsify = { git = "https://github.com/madonoharu/tsify.git", rev = "d89d5c1d16a83c0370109232c9197fc2fa072564", features = [
  "js",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["Window", "Performance"] }

[lints]
workspace = true
