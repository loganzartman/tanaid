<!DOCTYPE html>
<html style="color-scheme: light dark">
  <head>
    <link rel="stylesheet" href="./index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <pixel-perfect>
      <div class="window" style="height: 100%; box-sizing: border-box;">
        <div class="title-bar">
          <div class="title-bar-text">tanaid Tcl</div>
        </div>
        <div class="window-body">
          <p>
            <a target="_blank" href="https://github.com/loganzartman/tanaid"
              ><img
                alt="powered by tanaid"
                src="./powered-by.png"
                style="float: right; image-rendering: pixelated; width: 88px"
            /></a>
            run&nbsp;
            <a target="_blank" href="https://www.tcl-lang.org/">Tcl</a>
            &nbsp;in your browser
            <br />
            <span class="font-sans-13">(a little bit of it)</span>
          </p>
          <p>
          <div id="input" class="sunken-panel"></div>
          </p>
          <div>
            <div class="field-row-stacked">
              <label for="result">result:</label>
              <pre id="result"></pre>
            </div>
            <div class="field-row-stacked">
              <label for="stdout">stdout:</label>
                <textarea id="stdout" class="font-mono-13" style="height: 196px; min-height: 64px; resize: vertical; padding: 10px 6px"></textarea>
            </div>
          </div>
        </div>
      </div>
    </pixel-perfect>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
