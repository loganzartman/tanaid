name: CI

# Third-party actions are pinned to immutable commit SHAs; the trailing
# version comments are what Dependabot/Renovate read when bumping them.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
    - name: Build
      run: cargo build --workspace --verbose
    - name: Test
      run: cargo test --workspace --verbose

  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The npm package imports wasm-pack output directly, so the Rust build
    # has to happen before anything Node touches.
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
    - name: Install wasm-pack
      uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
      with:
        tool: wasm-pack
    - name: Build wasm
      run: ./scripts/build-wasm.sh

    # Version comes from devEngines.packageManager in the root package.json.
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install
      run: pnpm install --frozen-lockfile
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm test
