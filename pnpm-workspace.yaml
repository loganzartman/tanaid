packages:
  - "packages/*"

catalog:
  "@types/node": ^22.20.1
  typescript: ^7.0.2

# wasm-pack ships a postinstall that fetches its binary from the upstream GitHub release
allowBuilds:
  wasm-pack: true

minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  # Solid 2.0 RC for the playground; reviewed ahead of the release-age window
  - solid-js@2.0.0-rc.10
  - "@solidjs/web@2.0.0-rc.10"
  - "@solidjs/signals@2.0.0-rc.10"
  - "@solidjs/compiler@2.0.0-rc.10"
  - "@solidjs/compiler-darwin-arm64@2.0.0-rc.10"
  - "@solidjs/compiler-darwin-x64@2.0.0-rc.10"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.10"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0-rc.10"
  - "@solidjs/compiler-wasm32-wasi@2.0.0-rc.10"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0-rc.10"
  - "@solidjs/babel-plugin@2.0.0-rc.10"
  - "@solidjs/vite-plugin@3.0.0-next.46"
