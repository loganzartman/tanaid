[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
pollster = "1.0.1"
tanaid = { path = "crates/tanaid", version = "0.2.0" }
tanaid-tk = { path = "crates/tanaid-tk", version = "0.2.0" }
winit = "0.30"

[workspace.lints.rust]
warnings = "deny"

[profile.release]
debug = true
